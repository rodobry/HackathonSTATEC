services:
  app:
    build:
      context: .
      target: runtime
    image: luxembourg-trade
    ports:
      - "8000:8000"
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8000}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost:*,127.0.0.1:*}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    volumes:
      - eurostat-cache:/data/cache
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  eurostat-cache:
